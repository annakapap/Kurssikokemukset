{% extends "base.html" %}
{% block content %}

<h1>Lisää kommentti</h1>

<h2>{{ exp.course_name if exp.course_name is defined else exp["course_name"] }}</h2>

<form method="post" action="{{ url_for('comment_create', experience_id=exp["id"]) }}">
  <label for="content">Kommentti</label><br>
  <textarea id="content" name="content" rows="5" cols="60"></textarea><br><br>
  <button type="submit">Lähetä</button>
</form>

<p><a href="{{ url_for('experience_detail', experience_id=exp["id"]) }}">Takaisin julkaisuun</a></p>

{% endblock %}
